name: budget_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  another_flushbar: ^2.2.4
  calendar_date_picker2: ^3.0.0
  carousel_slider: ^5.1.2
  cloud_firestore: ^6.5.0
  collection: ^1.19.0
  csv: ^8.0.0
  file_picker: ^11.0.2
  firebase_core: ^4.10.0
  firebase_database: ^12.4.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_form_builder: ^10.3.0+2
  flutter_image_compress: ^2.5.0
  flutter_localization: ^0.4.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  gif_view: ^1.0.3
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  http: ^1.4.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  material_symbols_icons: ^4.2951.0
  math_expressions: ^3.1.0
  money2: ^6.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.4.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  week_number: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/currencies.json
    - assets/i18n/
  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont.ttf
          style: italic
    - family: Oranienbaum
      fonts:
        - asset: assets/fonts/Oranienbaum-Regular.ttf
    - family: ZenAntique
      fonts:
        - asset: assets/fonts/ZenAntique-Regular.ttf
    - family: ShipporiMincho
      fonts:
        - asset: assets/fonts/ShipporiMincho-Regular.ttf
    - family: ZenKakuGothicNew
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf

